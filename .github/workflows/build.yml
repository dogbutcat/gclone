---
# Github Actions build for rclone
# -*- compile-command: "yamllint -f parsable build.yml" -*-

name: build

# Trigger the workflow on push or pull request
on:
  push:
    tags:
      - '**'
  pull_request:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        job_name: ['linux', 'linux_386', 'mac_amd64', 'mac_arm64', 'windows', 'other_os', 'go1.26']

        include:
          - job_name: linux
            os: ubuntu-latest
            go: '~1.26.6'
            gotags: cmount
            build_flags: '-include "^linux/"'
            check: false
            quicktest: false
            racequicktest: false
            librclonetest: false
            deploy: true

          - job_name: linux_386
            os: ubuntu-latest
            go: '~1.26.6'
            goarch: 386
            gotags: cmount
            quicktest: false

          - job_name: mac_amd64
            os: macos-latest
            go: '~1.26.6'
            gotags: 'cmount'
            build_flags: '-include "^darwin/amd64" -cgo'
            quicktest: false
            racequicktest: false
            deploy: true

          - job_name: mac_arm64
            os: macos-latest
            go: '~1.26.6'
            gotags: 'cmount'
            build_flags: '-include "^darwin/arm64" -cgo -macos-arch arm64 -cgo-cflags=-I/usr/local/include -cgo-ldflags=-L/usr/local/lib'
            deploy: true

          - job_name: windows
            os: windows-latest
            go: '~1.26.6'
            gotags: cmount
            cgo: '0'
            build_flags: '-include "^windows/"'
            build_args: '-buildmode exe'
            quicktest: false
            deploy: true

          - job_name: other_os
            os: ubuntu-latest
            go: '~1.26.6'
            build_flags: '-exclude "^(windows/|darwin/|linux/)"'
            compile_all: true
            deploy: true

          - job_name: go1.26
            os: ubuntu-latest
            go: '~1.26.6'
            quicktest: false
            racequicktest: false

    name: ${{ matrix.job_name }}

    runs-on: ${{ matrix.os }}

    steps:
      - name: Get runner parameters
        id: get-runner-parameters
        run: |
          echo "year-week=$(date -u "+%Y%V")" >> $GITHUB_OUTPUT
          echo "runner-os-version=$ImageOS" >> $GITHUB_OUTPUT

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Go
        id: setup-go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true
          # Caching is handled explicitly below. setup-go's built-in cache
          # keys only on go.sum, so all matrix jobs collide on one key and
          # only the first to finish saves - which loses the cross-compile
          # build cache.
          cache: false

      - name: Get Go paths
        id: go-paths
        run: |
          echo "build-cache=$(go env GOCACHE)" >> $GITHUB_OUTPUT
          echo "mod-cache=$(go env GOMODCACHE)" >> $GITHUB_OUTPUT

      # The module cache holds downloaded source and is identical across
      # jobs (it depends only on go.sum, not on OS, arch or Go version), so
      # it is shared via a single key to avoid storing the same ~600 MiB in
      # every job's cache and overflowing the repo cache limit.
      - name: Module cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.go-paths.outputs.mod-cache }}
          key: go-mod-${{ steps.get-runner-parameters.outputs.year-week }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-mod-${{ steps.get-runner-parameters.outputs.year-week }}-
            go-mod-

      # The build cache holds compiled artifacts which are specific to the
      # OS, arch and Go version, so it is kept per job.
      - name: Build cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.go-paths.outputs.build-cache }}
          key: go-build-${{ matrix.job_name }}-${{ steps.get-runner-parameters.outputs.runner-os-version }}-go${{ steps.setup-go.outputs.go-version }}-${{ steps.get-runner-parameters.outputs.year-week }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-build-${{ matrix.job_name }}-${{ steps.get-runner-parameters.outputs.runner-os-version }}-go${{ steps.setup-go.outputs.go-version }}-${{ steps.get-runner-parameters.outputs.year-week }}-
            go-build-${{ matrix.job_name }}-${{ steps.get-runner-parameters.outputs.runner-os-version }}-go${{ steps.setup-go.outputs.go-version }}-

      - name: Set environment variables
        run: |
          echo 'GOTAGS=${{ matrix.gotags }}' >> $GITHUB_ENV
          echo 'BUILD_FLAGS=${{ matrix.build_flags }}' >> $GITHUB_ENV
          echo 'BUILD_ARGS=${{ matrix.build_args }}' >> $GITHUB_ENV
          if [[ "${{ matrix.goarch }}" != "" ]]; then echo 'GOARCH=${{ matrix.goarch }}' >> $GITHUB_ENV ; fi
          if [[ "${{ matrix.cgo }}" != "" ]]; then echo 'CGO_ENABLED=${{ matrix.cgo }}' >> $GITHUB_ENV ; fi

      - name: Install Libraries on Linux
        run: |
          sudo modprobe fuse
          sudo chmod 666 /dev/fuse
          sudo chown root:$USER /etc/fuse.conf
          sudo apt-get update
          sudo apt-get install -y fuse3 libfuse-dev rpm pkg-config git-annex git-annex-remote-rclone nfs-common
          # The podman static bundle in runner image ubuntu24/20260726.254 and
          # later ships a non-setuid fusermount3 in /usr/local/bin which
          # shadows the setuid one from the fuse3 package and breaks FUSE
          # mounts with "Operation not permitted", so remove it.
          sudo rm -f /usr/local/bin/fusermount /usr/local/bin/fusermount3
        if: matrix.os == 'ubuntu-latest'

      - name: Install Libraries on macOS
        run: |
          # https://github.com/Homebrew/brew/issues/15621#issuecomment-1619266788
          # https://github.com/orgs/Homebrew/discussions/4612#discussioncomment-6319008
          unset HOMEBREW_NO_INSTALL_FROM_API
          brew untap --force homebrew/core
          brew untap --force homebrew/cask
          brew untap --force aws/tap
          brew update
          brew install --cask macfuse
          brew install git-annex git-annex-remote-rclone
        if: matrix.os == 'macos-latest'

      - name: Install Libraries on Windows
        shell: powershell
        run: |
          $ProgressPreference = 'SilentlyContinue'
          choco install -y winfsp zip
          echo "CPATH=C:\Program Files\WinFsp\inc\fuse;C:\Program Files (x86)\WinFsp\inc\fuse" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($env:GOARCH -eq "386") {
            choco install -y mingw --forcex86 --force
            echo "C:\\ProgramData\\chocolatey\\lib\\mingw\\tools\\install\\mingw32\\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          # Copy mingw32-make.exe to make.exe so the same command line
          # can be used on Windows as on macOS and Linux
          $path = (get-command mingw32-make.exe).Path
          Copy-Item -Path $path -Destination (Join-Path (Split-Path -Path $path) 'make.exe')
        if: matrix.os == 'windows-latest'

      - name: Print Go version and environment
        run: |
          printf "Using go at: $(which go)\n"
          printf "Go version: $(go version)\n"
          printf "\n\nGo environment:\n\n"
          go env
          printf "\n\nRclone environment:\n\n"
          make vars
          printf "\n\nSystem environment:\n\n"
          env

      - name: Run tests
        run: |
          make quicktest
        if: matrix.quicktest

      - name: Race test
        run: |
          make racequicktest
        if: matrix.racequicktest

      - name: Compile all architectures test
        run: |
          make
          make compile_all
        if: matrix.compile_all

      - name: Deploy built binaries
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then make release_dep_linux ; fi
          make upload_github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # working-directory: '$(modulePath)'
        # Deploy binaries if enabled in config && not a PR && not a fork
        if: matrix.deploy && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.repository == 'dogbutcat/gclone'

      - name: Trim module cache before saving
        if: always()
        run: |
          # The downloaded module .zip archives are not needed to build from
          # the already-extracted module cache, so drop them before the cache
          # is saved - this roughly halves the module cache size.
          modcache=$(go env GOMODCACHE | tr '\\' '/')
          find "$modcache/cache/download" -name '*.zip' -type f -delete 2>/dev/null || true

  # lint:
